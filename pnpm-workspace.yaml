allowBuilds:
  esbuild: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vitest: 5.0.4
  '@vitest/coverage-v8': 5.0.4

minimumReleaseAgeExclude:
  - '@clack/core@1.5.1'
  - '@clack/prompts@1.8.1'

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
